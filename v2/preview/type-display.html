<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type · Fraunces display specimen</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      background-color: var(--paper-100);
      color: var(--ink-900);
      font-family: var(--font-sans, 'Inter', system-ui, sans-serif);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 4vw, 3.5rem);
      position: relative;
    }

    /* Paper grain wash over the page base. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: var(--paper-grain);
      background-size: 320px 320px;
      opacity: 0.5;
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }

    .specimen {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1040px;
      background-color: var(--paper-50);
      border: 1px solid var(--paper-400);
      border-radius: var(--radius-lg, 16px);
      box-shadow: var(--shadow-paper);
      padding: clamp(1.75rem, 4.5vw, 3.5rem);
      overflow: hidden;
    }

    .specimen::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--paper-grain);
      background-size: 280px 280px;
      opacity: 0.35;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .specimen > * { position: relative; z-index: 1; }

    .topline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem 1.5rem;
      flex-wrap: wrap;
      padding-bottom: 1.1rem;
      margin-bottom: clamp(1.5rem, 4vw, 2.75rem);
      border-bottom: 1px solid var(--paper-300);
    }

    .eyebrow {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      color: var(--terracotta-600);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.72rem;
      margin: 0;
    }

    .topline .spec-meta {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      color: var(--ink-400);
      margin: 0;
    }

    .hero {
      font-family: var(--font-display, 'Fraunces', Georgia, serif);
      font-weight: 600;
      color: var(--ink-900);
      font-size: var(--fs-display-xl, clamp(2.75rem, 6vw, 5.5rem));
      line-height: 1.02;
      letter-spacing: var(--tracking-display, -0.01em);
      margin: 0;
      max-width: 16ch;
    }

    .display-accent {
      font-style: italic;
      color: var(--terracotta-600);
    }

    .caption {
      margin: clamp(1.75rem, 4vw, 2.75rem) 0 0;
      padding-top: 1.1rem;
      border-top: 1px solid var(--paper-300);
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.75rem;
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 0.74rem;
      letter-spacing: 0.03em;
      color: var(--ink-500);
    }

    .caption .pair { white-space: nowrap; }

    .caption .pair b {
      color: var(--ink-700);
      font-weight: 600;
    }

    .swatch-rule {
      display: flex;
      gap: 6px;
      margin-top: 1.4rem;
    }

    .swatch-rule span {
      width: 30px;
      height: 8px;
      border-radius: var(--radius-pill, 9999px);
      border: 1px solid rgba(31, 26, 20, 0.12);
    }

    .swatch-rule .s-ink { background: var(--swatch-ink); }
    .swatch-rule .s-terracotta { background: var(--swatch-terracotta); }
    .swatch-rule .s-ochre { background: var(--swatch-ochre); }
    .swatch-rule .s-parchment { background: var(--swatch-parchment); }

    /* Accessible focus for the specimen surface when reached by keyboard. */
    .specimen:focus-visible {
      outline: none;
      box-shadow: var(--shadow-signal, 0 0 0 3px rgba(71, 110, 227, 0.45)), var(--shadow-paper);
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="specimen" tabindex="0" aria-label="Fraunces display type specimen">
    <div class="topline">
      <p class="eyebrow">Type · display</p>
      <p class="spec-meta">Fraunces · variable serif</p>
    </div>

    <h1 class="hero h1">See what your students <span class="display-accent">actually</span> understand.</h1>

    <p class="caption">
      <span class="pair"><b>Fraunces</b> display serif</span>
      <span class="pair"><b>Weight</b> 600 semibold</span>
      <span class="pair"><b>Size</b> clamp(2.75rem, 6vw, 5.5rem)</span>
      <span class="pair"><b>Tracking</b> -0.01em</span>
      <span class="pair"><b>Accent</b> italic · terracotta-600</span>
    </p>

    <div class="swatch-rule" aria-hidden="true">
      <span class="s-ink"></span>
      <span class="s-terracotta"></span>
      <span class="s-ochre"></span>
      <span class="s-parchment"></span>
    </div>
  </main>
</body>
</html>
