<!DOCTYPE html><html><head><meta charset="utf-8"><title>Altera logo · 16</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
 body{margin:0;background:#241f17;color:#e7d9bd;font-family:'JetBrains Mono',monospace;padding:30px 34px 70px}
 h1{font-family:'Fraunces',serif;color:#f3ead8;font-weight:600;margin:0 0 3px;font-size:30px}
 .sub{color:#cf8a3b;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:24px}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1640px}
 .frame{background:#f3ead8;border-radius:13px;height:158px;display:flex;align-items:center;justify-content:center;padding:20px;
   background-image:radial-gradient(circle at 50% 0%,rgba(207,138,59,.07),transparent 66%)}
 .frame img{max-height:104px;max-width:84%}
 figcaption{margin-top:9px;display:block}
 .tag{display:inline-block;font-size:9px;letter-spacing:.12em;color:#9c8c72;border:1px solid #4a4030;border-radius:5px;padding:2px 6px;margin-bottom:6px}
 figcaption b{display:block;color:#f3ead8;font-size:13px;margin-bottom:3px}
 .rat{display:block;color:#a89b80;font-size:10.5px;line-height:1.45}
 @media(max-width:1200px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<h1>Altera Logo · 16 options</h1><div class="sub">on cream · 4 lanes × 4 · pick by number</div>
<div class="grid"><figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-00.svg" alt="Pressroom Ink"></div>
<figcaption><span class="tag">TONAL / MONO</span><b>1. Pressroom Ink</b><span class="rat">One warm-black ink in many values; espresso reads crisp on cream, taupe top-stop gives the rings a quiet metallic sheen.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-01.svg" alt="Walnut Atelier"></div>
<figcaption><span class="tag">TONAL / MONO</span><b>2. Walnut Atelier</b><span class="rat">Single warm-brown tonal ladder, taupe to deep walnut; kin to parchment so it sits warm on cream without going muddy.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-02.svg" alt="Slate Folio"></div>
<figcaption><span class="tag">TONAL / MONO</span><b>3. Slate Folio</b><span class="rat">Cool pewter-to-charcoal monochrome; the one neutral grey option, dark enough to anchor cleanly on warm cream.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-03.svg" alt="Terra Monotone"></div>
<figcaption><span class="tag">TONAL / MONO</span><b>4. Terra Monotone</b><span class="rat">Single terracotta hue across all values, clay-light to oxblood; warm and editorial, the deep wordmark holds firm on cream.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-04.svg" alt="Baked Clay Wordmark"></div>
<figcaption><span class="tag">WARM EDITORIAL</span><b>5. Baked Clay Wordmark</b><span class="rat">Terracotta ALTERA is the warm hero on cream; quiet ink rings recede so the wordmark anchors and reads first.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-05.svg" alt="Golden Orbit"></div>
<figcaption><span class="tag">WARM EDITORIAL</span><b>6. Golden Orbit</b><span class="rat">Ochre rings carry a soft metallic glow; near-black ink wordmark gives max legibility and contrast on parchment.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-06.svg" alt="Autumn Kiln"></div>
<figcaption><span class="tag">WARM EDITORIAL</span><b>7. Autumn Kiln</b><span class="rat">Kraft-to-clay ring ramp plus a solid deep-clay wordmark: fully warm, tonal, letterpress-autumn cohesion on cream.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-07.svg" alt="Press Mark"></div>
<figcaption><span class="tag">WARM EDITORIAL</span><b>8. Press Mark</b><span class="rat">Deep-ink ALTERA reads first; rich terracotta rings warm the mark and an ochre LABS adds a third baked accent.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-08.svg" alt="Signal Terminus"></div>
<figcaption><span class="tag">INK + ACCENT</span><b>9. Signal Terminus</b><span class="rat">Pewter rings dive into one royal-blue toe; deep-ink ALTERA anchors. A single cool spark on warm cream.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-09.svg" alt="Blue Subscript"></div>
<figcaption><span class="tag">INK + ACCENT</span><b>10. Blue Subscript</b><span class="rat">Quiet pewter rings, near-black ink wordmark, and the lone signal-blue lives in LABS. Maximum restraint on cream.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-10.svg" alt="Kraft Ember"></div>
<figcaption><span class="tag">INK + ACCENT</span><b>11. Kraft Ember</b><span class="rat">Warm metallic rings ramp kraft into terracotta; ink wordmark holds. The spark goes warm, not blue, for press identity.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-11.svg" alt="Slate Glow"></div>
<figcaption><span class="tag">INK + ACCENT</span><b>12. Slate Glow</b><span class="rat">Soft slate-to-denim rings, warmest dark-ink ALTERA, and a surgical royal-blue glow isolated to LABS alone.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-12.svg" alt="Antique Bronze Foil"></div>
<figcaption><span class="tag">METALLIC</span><b>13. Antique Bronze Foil</b><span class="rat">Warm bronze ramp echoes foil-stamping; deep ink wordmark anchors hard on cream while ochre LABS ties it together.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-13.svg" alt="Pewter & Steel"></div>
<figcaption><span class="tag">METALLIC</span><b>14. Pewter & Steel</b><span class="rat">Cool silver-to-slate ramp reads as engraved metal against warm cream; ink wordmark stays maximally legible.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-14.svg" alt="Forged Terracotta"></div>
<figcaption><span class="tag">METALLIC</span><b>15. Forged Terracotta</b><span class="rat">Pewter cools into terracotta for a struck-medal warmth; ochre-to-ink wordmark gives subtle metallic lift, fully grounded on parchment.</span></figcaption></figure>
<figure class="cell"><div class="frame"><img src="public/images/logos/Altera/opts/opt-15.svg" alt="Steel & Denim"></div>
<figcaption><span class="tag">METALLIC</span><b>16. Steel & Denim</b><span class="rat">Bright silver ramps down to reserved royal-blue for a cool engraved signal; warm ink wordmark keeps ALTERA the legible anchor.</span></figcaption></figure></div></body></html>
