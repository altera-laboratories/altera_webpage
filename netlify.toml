[build]
  publish = "."
  command = ""

# /info was the November 24, 2025 combined legal page; the July 14, 2026
# privacy.html and terms.html supersede it.
[[redirects]]
  from = "/info"
  to = "/terms.html"
  status = 301

[[redirects]]
  from = "/info/*"
  to = "/terms.html"
  status = 301

# CLAUDE.md is agent guidance, not site content, and it records internal ops
# detail (deploy-credit history, the July 2026 published-document incident).
# The repo root is the publish directory, so without this rule Netlify would
# serve it at /CLAUDE.md.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Images change rarely and are renamed (or ?v= bumped) when they do, so let
# phones keep them for a month instead of revalidating on every visit.
[[headers]]
  for = "/public/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

# The v2 design workshop and the archived v1 page stay reachable for the
# team but must not be indexed or surface in search/social previews.
[[headers]]
  for = "/v2/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/v1.html"
  [headers.values]
    X-Robots-Tag = "noindex"
